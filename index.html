<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dress Tela - P2P Mesh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Auto-hide cursor and UI in fullscreen */
        .fullscreen-active { cursor: none; }
        .fullscreen-active .btn-fullscreen { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-[100dvh] flex flex-col overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Cabeçalho -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 sm:p-4 shrink-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 sm:p-2 rounded-lg ml-2 sm:ml-4">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-base sm:text-lg font-bold leading-tight flex items-center gap-2">
                        Dress Tela
                        <span id="header-room-id" class="hidden text-xs bg-gray-800 border border-gray-700 px-2 py-0.5 rounded font-mono text-blue-400 tracking-wider cursor-pointer hover:bg-gray-700 transition" onclick="copyRoomId()" title="Copiar Link de Acesso"></span>
                    </h1>
                </div>
            </div>
            
            <!-- Botão Sidebar Toggle (Ex-Status) -->
            <button id="btn-toggle-sidebar" onclick="toggleSidebar()" class="hidden items-center gap-2 text-xs sm:text-sm font-medium text-gray-300 bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-full border border-gray-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="hidden sm:inline">Pessoas na Sala</span>
            </button>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-grow flex flex-col relative overflow-hidden">
        
        <!-- TELA INICIAL -->
        <div id="screen-home" class="absolute inset-0 z-30 bg-gray-950 overflow-y-auto fade-in flex items-center justify-center p-4">
            <div class="max-w-2xl w-full text-center space-y-8 py-8">
                <div class="space-y-4">
                    <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Dress Tela</h2>
                    <p class="text-gray-400 text-base sm:text-lg">Compartilhe telas e câmeras via malha P2P ultra rápida.</p>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-8">
                    <button onclick="createRoom()" class="group relative flex flex-col items-center justify-center p-6 sm:p-8 bg-gray-900 rounded-2xl border-2 border-gray-800 hover:border-blue-500 transition-all hover:-translate-y-1">
                        <div class="bg-blue-500/10 text-blue-500 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold mb-2">Criar Sala</h3>
                        <p class="text-sm text-gray-500">Inicie uma nova sala e convide outras pessoas.</p>
                    </button>
                    <div class="group relative flex flex-col items-center justify-center p-6 sm:p-8 bg-gray-900 rounded-2xl border-2 border-gray-800 transition-all">
                        <div class="bg-purple-500/10 text-purple-400 p-4 rounded-full mb-4">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold mb-3">Entrar</h3>
                        <div class="w-full space-y-2">
                            <input type="text" id="join-room-id" class="w-full text-center text-lg tracking-widest font-mono font-bold bg-gray-950 border border-gray-700 rounded-lg p-3 text-purple-400 focus:outline-none focus:border-purple-500 transition uppercase" placeholder="ABC-123" maxlength="7">
                            <button onclick="joinRoom()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-3 rounded-lg transition">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TELA DA SALA -->
        <div id="screen-room" class="hidden absolute inset-0 z-20 flex flex-col bg-gray-950">
            <div class="flex flex-row flex-grow overflow-hidden w-full relative">
                
                <!-- Área de Foco (Central) -->
                <div id="focus-area" class="flex-grow flex items-center justify-center p-2 sm:p-4 relative bg-gray-950">
                    <!-- Renderizado via JS -->
                </div>

                <!-- Barra Lateral Direita (Cards) -->
                <aside id="right-sidebar" class="w-full sm:w-80 bg-gray-900 border-l border-gray-800 flex flex-col shrink-0 absolute sm:relative top-0 bottom-0 right-0 z-30 transition-transform duration-300 transform translate-x-full">
                    <div class="p-3 border-b border-gray-800 flex items-center justify-between bg-gray-900">
                        <h3 class="text-sm font-bold text-gray-300">Sala</h3>
                        <button onclick="toggleSidebar()" class="sm:hidden text-gray-400 hover:text-white p-2 bg-gray-800 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                    <div id="cards-container" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 gap-4 content-start">
                        <!-- Cards injetados via JS -->
                    </div>
                </aside>
            </div>

            <!-- Controles Base -->
            <div class="shrink-0 h-20 sm:h-24 bg-gray-900 border-t border-gray-800 flex items-center justify-center gap-4 sm:gap-6 px-4 z-40 relative">
                <button id="btn-share-screen" onclick="toggleShare('screen')" class="flex flex-col items-center gap-1 group">
                    <div class="icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:bg-blue-600 group-hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="label-text text-[10px] sm:text-xs font-medium text-gray-500 group-hover:text-gray-300">Tela</span>
                </button>
                
                <button id="btn-share-camera" onclick="toggleShare('camera')" class="flex flex-col items-center gap-1 group">
                    <div class="icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:bg-green-600 group-hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="label-text text-[10px] sm:text-xs font-medium text-gray-500 group-hover:text-gray-300">Câmera</span>
                </button>

                <div class="w-px h-10 bg-gray-800 mx-2"></div>

                <button onclick="endSession()" class="flex flex-col items-center gap-1 group">
                    <div class="w-16 h-12 sm:w-20 sm:h-14 rounded-2xl bg-red-600 hover:bg-red-500 flex items-center justify-center transition-all text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <span class="text-[10px] sm:text-xs font-medium text-red-400">Sair da Sala</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Editar Nome -->
    <div id="modal-name" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8 max-w-sm w-full fade-in">
            <h3 class="text-xl font-bold mb-2">Seu Nome</h3>
            <p class="text-sm text-gray-400 mb-4">Como você deseja ser chamado na sala?</p>
            <input type="text" id="input-my-name" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition mb-4" placeholder="Digite seu nome">
            <div class="flex gap-3">
                <button onclick="document.getElementById('modal-name').classList.replace('flex', 'hidden')" class="flex-1 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg font-medium transition">Cancelar</button>
                <button onclick="saveMyName()" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const APP_PREFIX = "dress-tela-";
        let myPeer = null;
        let myPeerId = null;
        let myName = "Visitante";
        
        let localStreams = {}; // streamId -> MediaStream
        let peerStreams = {}; // peerId -> { streamId -> MediaStream }
        let activeLocalMedia = { screen: null, camera: null };
        let myOutgoingCalls = []; 
        let dataConnections = {}; // peerId -> DataConnection
        let participantNames = {}; // peerId -> name

        let isSidebarOpen = window.innerWidth >= 640;
        let focusedStreamId = null;
        let focusedStreamPeerId = null;

        let uiTimeout;

        // Ao carregar
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                document.getElementById('join-room-id').value = code;
            }
            updateSidebarUI();
            renderEmptyFocus();
        });

        // ==========================
        // UI & Sidebar Logic
        // ==========================

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            updateSidebarUI();
        }

        function updateSidebarUI() {
            const sidebar = document.getElementById('right-sidebar');
            if (isSidebarOpen) {
                sidebar.classList.remove('translate-x-full');
            } else {
                sidebar.classList.add('translate-x-full');
            }
        }

        // ==========================
        // Cards Logic
        // ==========================

        function renderSidebarCards() {
            const container = document.getElementById('cards-container');
            // Check all known peers (myPeerId + connected peers)
            const allPeers = [myPeerId, ...Object.keys(dataConnections)];

            // Create or update cards for each peer
            allPeers.forEach(peerId => {
                if(!peerId) return;
                
                const isLocal = peerId === myPeerId;
                const name = isLocal ? myName : (participantNames[peerId] || `Usuário ${peerId.replace(APP_PREFIX, '').substring(0,4)}`);
                const streams = peerStreams[peerId] || {};
                const streamIds = Object.keys(streams);

                const existingCards = container.querySelectorAll(`.user-card[data-peer="${peerId}"]`);
                
                if (streamIds.length === 0) {
                    // Remove any media cards
                    existingCards.forEach(card => {
                        if(card.dataset.stream !== 'no-media') card.remove();
                    });
                    
                    let noMediaCard = container.querySelector(`.user-card[data-peer="${peerId}"][data-stream="no-media"]`);
                    if (!noMediaCard) {
                        noMediaCard = createCardElement(peerId, 'no-media', name, null);
                        container.appendChild(noMediaCard);
                    } else {
                        noMediaCard.querySelector('.card-name').innerText = name + (isLocal ? " (Você)" : "");
                    }
                } else {
                    // Remove no-media card if it exists
                    const noMediaCard = container.querySelector(`.user-card[data-peer="${peerId}"][data-stream="no-media"]`);
                    if (noMediaCard) noMediaCard.remove();

                    streamIds.forEach(sId => {
                        let streamCard = container.querySelector(`.user-card[data-peer="${peerId}"][data-stream="${sId}"]`);
                        const stream = streams[sId];
                        
                        if (!streamCard) {
                            streamCard = createCardElement(peerId, sId, name, stream);
                            container.appendChild(streamCard);
                        } else {
                            streamCard.querySelector('.card-name').innerText = name + (isLocal ? " (Você)" : "");
                        }

                        // Auto-focus if none
                        if (!focusedStreamId) {
                            setFocus(stream, peerId);
                        }
                    });

                    // Cleanup old streams
                    existingCards.forEach(card => {
                        if(card.dataset.stream !== 'no-media' && !streamIds.includes(card.dataset.stream)) {
                            card.remove();
                        }
                    });
                }
            });

            // Cleanup disconnected peers cards
            container.querySelectorAll('.user-card').forEach(card => {
                const pId = card.dataset.peer;
                if (!allPeers.includes(pId)) {
                    card.remove();
                }
            });
        }

        function createCardElement(peerId, streamId, name, stream) {
            const isLocal = peerId === myPeerId;
            const displayName = name + (isLocal ? " (Você)" : "");
            
            const card = document.createElement('div');
            card.className = "user-card relative bg-gray-950 rounded-xl overflow-hidden border border-gray-800 transition hover:border-blue-500 shadow-sm shrink-0 w-full";
            card.dataset.peer = peerId;
            card.dataset.stream = streamId;

            if (stream) {
                card.style.height = "140px";
                card.className += " cursor-pointer";
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) video.muted = true;
                video.className = "w-full h-full object-cover pointer-events-none";
                card.appendChild(video);
                
                const labelRow = document.createElement('div');
                labelRow.className = "absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-3 flex items-center justify-between";
                labelRow.innerHTML = `<span class="card-name font-medium text-white text-xs truncate drop-shadow-md">${displayName}</span>`;
                
                if (isLocal) {
                    const btn = document.createElement('button');
                    btn.className = "text-gray-300 hover:text-white pointer-events-auto z-10 p-1";
                    btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`;
                    btn.onclick = (e) => { e.stopPropagation(); editMyName(); };
                    labelRow.appendChild(btn);
                }
                
                card.appendChild(labelRow);

                card.addEventListener('click', () => {
                    setFocus(stream, peerId);
                });
            } else {
                card.className += " p-3 flex items-center gap-3";
                card.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center shrink-0 text-gray-500">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="card-name font-medium text-gray-300 text-sm truncate flex-1">${displayName}</div>
                `;
                if (isLocal) {
                    const btn = document.createElement('button');
                    btn.className = "p-1.5 hover:bg-gray-800 rounded-md text-gray-500 hover:text-white transition";
                    btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`;
                    btn.onclick = (e) => { e.stopPropagation(); editMyName(); };
                    card.appendChild(btn);
                }
            }
            
            return card;
        }

        // ==========================
        // Focus Area
        // ==========================

        function renderEmptyFocus() {
            const focusArea = document.getElementById('focus-area');
            focusArea.innerHTML = `
                <div class="text-center text-gray-600 flex flex-col items-center">
                    <div class="w-16 h-16 rounded-full bg-gray-900 flex items-center justify-center mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <p class="font-medium text-lg">Nenhum vídeo em foco.</p>
                    <p class="text-sm mt-1">Clique em uma miniatura na barra lateral.</p>
                </div>
            `;
            focusedStreamId = null;
            focusedStreamPeerId = null;
        }

        function setFocus(stream, peerId) {
            if (!stream) {
                renderEmptyFocus();
                return;
            }
            
            focusedStreamId = stream.id;
            focusedStreamPeerId = peerId;
            const focusArea = document.getElementById('focus-area');
            focusArea.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.className = "relative w-full h-full flex flex-col items-center justify-center fade-in bg-black sm:rounded-2xl overflow-hidden sm:ring-1 sm:ring-gray-800";
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (peerId === myPeerId) video.muted = true;
            video.className = "w-full h-full object-contain pointer-events-none";
            wrapper.appendChild(video);

            // Nome da pessoa sobre o foco (apenas mostra quando move o mouse, implementado abaixo via classe)
            const nameBadge = document.createElement('div');
            const name = peerId === myPeerId ? myName : (participantNames[peerId] || 'Desconhecido');
            nameBadge.className = "absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg text-white font-medium text-sm z-30 transition-opacity duration-300 pointer-events-none ui-element";
            nameBadge.innerText = name;
            wrapper.appendChild(nameBadge);

            // Botão Fullscreen
            const fsBtn = document.createElement('button');
            fsBtn.className = "btn-fullscreen absolute top-4 right-4 bg-black/60 p-2.5 rounded-lg text-white hover:bg-blue-600 transition backdrop-blur-md z-30 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 ui-element cursor-pointer pointer-events-auto";
            fsBtn.innerHTML = `
                <svg class="w-5 h-5 btn-fullscreen-enter" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                <svg class="w-5 h-5 btn-fullscreen-exit hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h4v4m0-4l-5 5m11-5h4v4m0-4l-5 5M4 10h4V6m0 4l-5-5m11 5h4V6m0 4l-5-5"></path></svg>
            `;
            wrapper.classList.add('group'); 
            
            fsBtn.onclick = () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen().catch(err => console.error(err));
                } else {
                    document.exitFullscreen();
                }
            };
            wrapper.appendChild(fsBtn);
            
            // Autoplay Fallback Overlay
            const playOverlay = document.createElement('div');
            playOverlay.className = "absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-40 text-white cursor-pointer hidden pointer-events-auto";
            playOverlay.innerHTML = `
                <svg class="w-16 h-16 text-blue-500 mb-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span class="font-bold text-lg">Clique para Assistir</span>
            `;
            playOverlay.onclick = () => {
                video.play().then(() => playOverlay.classList.replace('flex', 'hidden')).catch(console.error);
            };
            wrapper.appendChild(playOverlay);

            // Auto-hide UI event on Fullscreen
            wrapper.addEventListener('mousemove', () => {
                if (document.fullscreenElement) {
                    wrapper.classList.remove('fullscreen-active');
                    const elements = wrapper.querySelectorAll('.ui-element');
                    elements.forEach(el => el.style.opacity = '1');
                    
                    clearTimeout(uiTimeout);
                    uiTimeout = setTimeout(() => {
                        if (document.fullscreenElement) {
                            wrapper.classList.add('fullscreen-active');
                            elements.forEach(el => el.style.opacity = '0');
                        }
                    }, 2500);
                }
            });

            focusArea.appendChild(wrapper);

            video.play().catch(e => {
                console.warn("Autoplay bloqueado:", e);
                playOverlay.classList.remove('hidden');
                playOverlay.classList.add('flex');
            });
        }

        document.addEventListener('fullscreenchange', () => {
            const wrapper = document.querySelector('#focus-area > div');
            if(!wrapper) return;
            const fsBtn = wrapper.querySelector('.btn-fullscreen');
            if(!fsBtn) return;

            if (document.fullscreenElement) {
                fsBtn.querySelector('.btn-fullscreen-enter').classList.add('hidden');
                fsBtn.querySelector('.btn-fullscreen-exit').classList.remove('hidden');
                // Trigger auto-hide setup
                wrapper.dispatchEvent(new Event('mousemove'));
            } else {
                fsBtn.querySelector('.btn-fullscreen-enter').classList.remove('hidden');
                fsBtn.querySelector('.btn-fullscreen-exit').classList.add('hidden');
                wrapper.classList.remove('fullscreen-active');
                wrapper.querySelectorAll('.ui-element').forEach(el => el.style.opacity = '1');
                clearTimeout(uiTimeout);
            }
        });

        // ==========================
        // PeerJS & Connection Logic
        // ==========================

        function generateId() {
            return Math.random().toString(36).substr(2, 4).toUpperCase();
        }

        function createRoom() {
            const shortId = generateId();
            initializePeer(APP_PREFIX + shortId);
        }

        function joinRoom() {
            const input = document.getElementById('join-room-id').value.trim().toUpperCase();
            if (input.length > 0) {
                initializePeer(null, APP_PREFIX + input);
            }
        }

        function initializePeer(requestedId = null, joinTarget = null) {
            if (myPeer) myPeer.destroy();

            const peerConfig = requestedId ? { id: requestedId } : undefined;
            myPeer = new Peer(peerConfig);

            myPeer.on('open', (id) => {
                myPeerId = id;
                const shortId = id.replace(APP_PREFIX, '');
                
                // Configura UI
                document.getElementById('screen-home').classList.add('hidden');
                document.getElementById('screen-room').classList.replace('hidden', 'flex');
                document.getElementById('header-room-id').innerText = shortId;
                document.getElementById('header-room-id').classList.remove('hidden');
                document.getElementById('btn-toggle-sidebar').classList.replace('hidden', 'flex');
                
                // Modify URL for easy sharing
                const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?code=' + shortId;
                window.history.pushState({path:newurl},'',newurl);

                renderSidebarCards();

                if (joinTarget) {
                    connectToPeer(joinTarget);
                }
            });

            // Incoming Data Connection
            myPeer.on('connection', (conn) => {
                setupDataConnection(conn);
            });

            // Incoming Media Calls
            myPeer.on('call', (call) => {
                call.answer(); // Apenas recebe
                
                call.on('stream', (remoteStream) => {
                    const callerId = call.peer;
                    if(!peerStreams[callerId]) peerStreams[callerId] = {};
                    
                    // If stream already exists, ignore
                    if (peerStreams[callerId][remoteStream.id]) return;
                    
                    peerStreams[callerId][remoteStream.id] = remoteStream;
                    renderSidebarCards();
                });

                call.on('close', () => {
                    // It's hard to map call directly to stream ID if the call closes,
                    // but tracks ending handles cleanup usually. Let's do a hard cleanup if needed.
                });
            });

            myPeer.on('error', (err) => {
                console.error(err);
                if (err.type === 'unavailable-id') {
                    alert('Esta sala já existe e foi criada por você (ou ID em uso).');
                } else if (err.type === 'peer-unavailable') {
                    alert('Sala não encontrada.');
                }
            });
        }

        function connectToPeer(targetId) {
            const conn = myPeer.connect(targetId);
            setupDataConnection(conn);
        }

        function setupDataConnection(conn) {
            conn.on('open', () => {
                dataConnections[conn.peer] = conn;
                
                // Ao conectar, envia meu nome e solicita a rede
                conn.send({ type: 'UPDATE_NAME', name: myName });
                conn.send({ type: 'REQUEST_NAMES' });
                
                // Compartilha minha lista de conexões (Malha)
                const knownPeers = Object.keys(dataConnections);
                if (knownPeers.length > 0) {
                    conn.send({ type: 'PEER_LIST', peers: knownPeers });
                }

                renderSidebarCards();

                // Se eu tiver media, envio para o novo
                Object.values(localStreams).forEach(stream => {
                    const call = myPeer.call(conn.peer, stream);
                    myOutgoingCalls.push(call);
                });
            });

            conn.on('data', (data) => {
                if (data.type === 'PEER_LIST') {
                    data.peers.forEach(p => {
                        if (p !== myPeerId && !dataConnections[p]) {
                            connectToPeer(p);
                        }
                    });
                } else if (data.type === 'UPDATE_NAME') {
                    participantNames[conn.peer] = data.name;
                    renderSidebarCards();
                } else if (data.type === 'REQUEST_NAMES') {
                    conn.send({ type: 'UPDATE_NAME', name: myName });
                }
            });

            conn.on('close', () => {
                handlePeerLeave(conn.peer);
            });
        }

        function handlePeerLeave(peerId) {
            delete dataConnections[peerId];
            delete participantNames[peerId];
            delete peerStreams[peerId];
            
            // Check if focused stream was from this peer
            if (focusedStreamPeerId === peerId) {
                renderEmptyFocus();
                // Find next stream to focus
                let nextStream = null;
                let nextPeer = null;
                for (const pId in peerStreams) {
                    const sIds = Object.keys(peerStreams[pId]);
                    if (sIds.length > 0) {
                        nextStream = peerStreams[pId][sIds[0]];
                        nextPeer = pId;
                        break;
                    }
                }
                if (nextStream) setFocus(nextStream, nextPeer);
            }
            
            renderSidebarCards();
        }

        // ==========================
        // Media Sharing
        // ==========================

        async function toggleShare(type) {
            const streamId = activeLocalMedia[type];
            if (streamId && localStreams[streamId]) {
                stopSpecificMediaShare(streamId);
            } else {
                try {
                    let stream;
                    if (type === 'screen') {
                        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    } else {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    }
                    
                    localStreams[stream.id] = stream;
                    activeLocalMedia[type] = stream.id;

                    stream.getTracks().forEach(track => {
                        track.onended = () => stopSpecificMediaShare(stream.id); 
                    });

                    if (!peerStreams[myPeerId]) peerStreams[myPeerId] = {};
                    peerStreams[myPeerId][stream.id] = stream;
                    renderSidebarCards();

                    Object.keys(dataConnections).forEach(peerId => {
                        const call = myPeer.call(peerId, stream);
                        myOutgoingCalls.push(call);
                    });

                    updateShareButtonsUI();
                } catch (err) {
                    console.error("Erro ao obter mídia:", err);
                }
            }
        }

        function updateShareButtonsUI() {
            // Update Screen Button
            const btnScreen = document.getElementById('btn-share-screen');
            if (activeLocalMedia.screen && localStreams[activeLocalMedia.screen]) {
                btnScreen.querySelector('.icon-container').className = "icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-red-600 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-white hover:bg-red-500";
                btnScreen.querySelector('.label-text').innerText = "Parar Tela";
                btnScreen.querySelector('.label-text').classList.replace('text-gray-500', 'text-red-400');
            } else {
                btnScreen.querySelector('.icon-container').className = "icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:bg-blue-600 group-hover:text-white";
                btnScreen.querySelector('.label-text').innerText = "Tela";
                btnScreen.querySelector('.label-text').classList.replace('text-red-400', 'text-gray-500');
            }

            // Update Camera Button
            const btnCamera = document.getElementById('btn-share-camera');
            if (activeLocalMedia.camera && localStreams[activeLocalMedia.camera]) {
                btnCamera.querySelector('.icon-container').className = "icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-red-600 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-white hover:bg-red-500";
                btnCamera.querySelector('.label-text').innerText = "Parar Câm";
                btnCamera.querySelector('.label-text').classList.replace('text-gray-500', 'text-red-400');
            } else {
                btnCamera.querySelector('.icon-container').className = "icon-container w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center transition-all shadow-lg text-gray-400 group-hover:bg-green-600 group-hover:text-white";
                btnCamera.querySelector('.label-text').innerText = "Câmera";
                btnCamera.querySelector('.label-text').classList.replace('text-red-400', 'text-gray-500');
            }
        }

        function stopSpecificMediaShare(streamId) {
            const stream = localStreams[streamId];
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                delete localStreams[streamId];
                
                if (activeLocalMedia.screen === streamId) activeLocalMedia.screen = null;
                if (activeLocalMedia.camera === streamId) activeLocalMedia.camera = null;
                
                if (peerStreams[myPeerId]) {
                    delete peerStreams[myPeerId][streamId];
                }
                
                if (focusedStreamId === streamId) {
                    renderEmptyFocus();
                }
                
                renderSidebarCards();
                updateShareButtonsUI();
            }
        }

        function stopAllMediaShare() {
            Object.values(localStreams).forEach(stream => {
                stream.getTracks().forEach(t => t.stop());
            });
            localStreams = {};
            activeLocalMedia = { screen: null, camera: null };
            delete peerStreams[myPeerId];
            
            myOutgoingCalls.forEach(call => call.close());
            myOutgoingCalls = [];
            
            if (focusedStreamPeerId === myPeerId) {
                renderEmptyFocus();
            }
            renderSidebarCards();
            updateShareButtonsUI();
        }

        function endSession() {
            stopAllMediaShare();
            if (myPeer) myPeer.destroy();
            location.reload();
        }

        // ==========================
        // Name Management
        // ==========================

        function editMyName() {
            document.getElementById('input-my-name').value = myName === "Visitante" ? "" : myName;
            document.getElementById('modal-name').classList.replace('hidden', 'flex');
            document.getElementById('input-my-name').focus();
        }

        function saveMyName() {
            const val = document.getElementById('input-my-name').value.trim();
            if (val) {
                myName = val;
                Object.values(dataConnections).forEach(conn => {
                    conn.send({ type: 'UPDATE_NAME', name: myName });
                });
                renderSidebarCards();
            }
            document.getElementById('modal-name').classList.replace('flex', 'hidden');
        }

        function copyRoomId() {
            if(!myPeerId) return;
            const link = window.location.protocol + "//" + window.location.host + window.location.pathname + '?code=' + myPeerId.replace(APP_PREFIX, '');
            navigator.clipboard.writeText(link).then(() => {
                alert("Link copiado para a área de transferência!");
            });
        }

        // Otimização: Pausar vídeos remotos não focados se a aba não estiver visível
        document.addEventListener("visibilitychange", () => {
            const remoteCards = document.getElementById('cards-container').querySelectorAll('video');
            if (document.hidden) {
                remoteCards.forEach(v => v.pause());
            } else {
                remoteCards.forEach(v => {
                    const streamId = v.srcObject ? v.srcObject.id : null;
                    // Dont play if it's not actually supposed to be playing or if we wanted to save resources
                    v.play().catch(e => console.log(e));
                });
            }
        });
    </script>
